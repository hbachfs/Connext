user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/log/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Ảnh tối đa 15 MB; video và tài liệu tối đa 100 MB.
    client_max_body_size 110M;

    # Cấu hình chuyển hướng HTTP sang HTTPS
    server {
        listen 80;
        server_name connext-app.eastasia.cloudapp.azure.com; # Thay bằng tên miền của bạn nếu có

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Cấu hình chính cho HTTPS
    server {
        listen 443 ssl;
        server_name connext-app.eastasia.cloudapp.azure.com;

        # Đường dẫn chứng chỉ SSL Let's Encrypt trên VPS
        ssl_certificate /etc/letsencrypt/live/connext-app.eastasia.cloudapp.azure.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/connext-app.eastasia.cloudapp.azure.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Định tuyến cho Frontend (Blazor / Web)
        location / {
            proxy_pass http://connext-web:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Định tuyến cho Backend API & SignalR Hub
        location /api/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
        
        location /hubs/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}