    code: "\r

      pm.test(\"TC_UPLOAD_08 - Tu choi nguoi ngoai xem kho File\", function ()
      {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Thong bao khong thuoc cuoc hoi thoai\", function () {\r

      \    pm.expect(pm.response.text()).to.include(\r

      \        \"Bạn không thuộc cuộc hội thoại này\"\r

      \    );\r

      });\r\n"
    language: text/javascript
order: 30000
