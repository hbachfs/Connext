$kind: http-request
url: "{{baseUrl}}/api/Conversations/groups"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"name\": \"QA2 Test Group\",\r

    \  \"memberIds\": [\r

    \    \"b9c25312-a9ff-4b5f-ac91-28534412366b\"\r

    \  ]\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"TC_CONV_11 - Status 400 Bad Request\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"TC_CONV_11 - Loi thieu thanh vien\", function () {\r

      \    const data = pm.response.json();\r

      \    const errors = data.errors || {};\r

      \    const memberError = errors.MemberIds || errors.memberIds;\r

      \r

      \    pm.expect(memberError, \"Phai co loi cua MemberIds\").to.exist;\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: "const body = JSON.parse(pm.request.body.raw);\r

      \r

      body.name = \"A\".repeat(101);\r

      \r

      pm.request.body.update(JSON.stringify(body));"
    language: text/javascript
order: 45000
