$kind: http-request
url: "{{baseUrl}}/api/auth/forgot-password"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"{{testEmail}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"TC_RESET_01 - Status 202 Accepted\", function () {\r

      \    pm.response.to.have.status(202);\r

      });\r

      \r

      pm.test(\"Thong bao phan hoi dung\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.message).to.eql(\r

      \        \"Nếu email đã đăng ký, mã xác minh sẽ được gửi đến hộp thư.\"\r

      \    );\r

      });"
    language: text/javascript
order: 9000
