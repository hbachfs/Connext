$kind: http-request
url: "{{baseUrl}}/api/Conversations/{{convGroupId}}/files"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - qa2-upload-fake.png
      description: ""
      disabled: false
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"TC_UPLOAD_03 - Tu choi file sai chu ky\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Thong bao noi dung khong khop phan mo rong\", function () {\r

      \    pm.expect(pm.response.text()).to.include(\r

      \        \"Nội dung tệp không khớp với phần mở rộng được khai báo\"\r

      \    );\r

      });\r\n"
    language: text/javascript
order: 38000
