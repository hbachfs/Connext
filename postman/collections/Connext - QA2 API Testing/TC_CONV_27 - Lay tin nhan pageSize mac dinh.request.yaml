$kind: http-request
url: "{{baseUrl}}/api/Conversations/{{convGroupId}}/messages"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"TC_CONV_27 - Status 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"TC_CONV_27 - Danh sach toi da 50 tin nhan\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data).to.be.an(\"array\");\r

      \    pm.expect(data.length).to.be.at.most(50);\r

      });\r\n"
    language: text/javascript
order: 67000
