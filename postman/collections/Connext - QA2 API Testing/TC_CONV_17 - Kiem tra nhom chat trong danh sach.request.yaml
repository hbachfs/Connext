$kind: http-request
url: "{{baseUrl}}/api/Conversations"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"TC_CONV_17 - Status 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"TC_CONV_17 - Nhom chat xuat hien trong danh sach\", function ()
      {\r

      \    const data = pm.response.json();\r

      \    const groupId = pm.environment.get(\"convGroupId\");\r

      \r

      \    pm.expect(data).to.be.an(\"array\");\r

      \    pm.expect(groupId, \"Phai co convGroupId\").to.be.a(\"string\");\r

      \r

      \    const group = data.find(item => item.id === groupId);\r

      \r

      \    pm.expect(group, \"Phai tim thay nhom chat\").to.exist;\r

      \    pm.expect(group.name).to.eql(\"QA2 Conversation Test Group\");\r

      \    pm.expect(group.isGroup).to.eql(true);\r

      });\r\n"
    language: text/javascript
order: 74000
