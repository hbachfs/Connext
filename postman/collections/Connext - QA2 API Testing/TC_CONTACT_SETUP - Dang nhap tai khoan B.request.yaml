$kind: http-request
url: "{{baseUrl}}/api/Auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"phoneNumber\": \"0912345692\",\r

    \  \"password\": \"{{contactBPassword}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Dang nhap tai khoan B thanh cong\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Tai khoan B co JWT Token\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.token).to.be.a(\"string\");\r

      \    pm.expect(data.token.length).to.be.greaterThan(0);\r

      });\r

      \r

      if (pm.response.code === 200) {\r

      \    const data = pm.response.json();\r

      \r

      \    if (data.token) {\r

      \        pm.environment.set(\"contactBToken\", data.token);\r

      \    }\r

      }"
    language: text/javascript
order: 6000
