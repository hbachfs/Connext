    code: "pm.test(\"TC_AUTH_05 - Dang nhap SDT khong ton tai\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Thong bao loi chinh xac\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.message).to.eql(\r

      \        \"Số điện thoại hoặc mật khẩu không chính xác.\"\r

      \    );\r

      });\r

      \r

      pm.test(\"Khong tra ve JWT Token\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data).to.not.have.property(\"token\");\r

      });"
