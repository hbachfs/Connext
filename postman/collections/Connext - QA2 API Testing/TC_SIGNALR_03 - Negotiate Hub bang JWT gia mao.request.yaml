$kind: http-request
url: "{{baseUrl}}/hubs/chat/negotiate?negotiateVersion=1"
method: POST
queryParams:
  negotiateVersion: "1"
auth:
  type: bearer
  credentials:
    token: fake.invalid.token
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"TC_SIGNALR_03 - Tu choi JWT gia mao\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Hub tu choi token khong hop le\", function () {\r

      \    pm.expect(pm.response.headers.get(\"WWW-Authenticate\"))\r

      \        .to.include(\"Bearer\");\r

      });\r\n"
    language: text/javascript
order: 10000
