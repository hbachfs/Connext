$kind: http-request
url: "{{baseUrl}}/api/Contacts/requests"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{convB2Token}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"SETUP - B2 lay loi moi thanh cong\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"SETUP - B2 co loi moi dang cho\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.received).to.be.an(\"array\");\r

      \    pm.expect(data.received.length).to.be.greaterThan(0);\r

      \r

      \    const request = data.received[0];\r

      \    pm.expect(request.requestId).to.be.a(\"string\");\r

      \r

      \    pm.environment.set(\"convB2RequestId\", request.requestId);\r

      });\r\n"
    language: text/javascript
order: 34000
