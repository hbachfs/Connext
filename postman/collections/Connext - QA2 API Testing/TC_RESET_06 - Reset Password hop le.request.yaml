$kind: http-request
url: "{{baseUrl}}/api/auth/reset-password"
method: POST
body:
  type: json
  content: "{\r

    \  \"token\": \"{{resetToken}}\",\r

    \  \"newPassword\": \"{{newPassword}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"TC_RESET_06 - Status 204 No Content\", function () {\r

      \    pm.response.to.have.status(204);\r

      });\r

      \r

      pm.test(\"TC_RESET_06 - Response Body rong\", function () {\r

      \    pm.expect(pm.response.text()).to.eql(\"\");\r

      });\r\n"
    language: text/javascript
order: 12000
