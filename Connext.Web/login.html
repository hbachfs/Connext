<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <title>Đăng nhập - Connext</title>
</head>

<body>
    <div class="auth-page">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
        <div class="auth-card">
            <div class="auth-logo"><i class="fa-regular fa-comment-dots"></i></div>
            <h4 class="text-center mb-1">Chào mừng trở lại!</h4>
            <p class="text-center text-muted-cnx fs-5 mb-5">Đăng nhập để tiếp tục trò chuyện</p>
            <div class="mb-3">
                <label for="phone" class="form-label">Số điện thoại</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                    <input type="tel" id="phone" class="form-control" placeholder="Nhập số điện thoại">
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
                    <button type="button" class="btn toggle-pass"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <div class="text-end mb-3 "><a href="reset-password.html">Quên mật khẩu?</a></div>
            <button type="button" class="btn btn-primary w-100 py-2" onclick="handleLogin()">Đăng nhập</button>
            <p class="text-center small text-muted-cnx mt-3 mb-0">Chưa có tài khoản? <a href="register.html">Đăng ký
                    ngay</a></p>
        </div>
    </div>
    <script src="js/common.js"></script>
    <script>function handleLogin() { /* nối API đăng nhập của BE */ }</script>
</body>

</html>
