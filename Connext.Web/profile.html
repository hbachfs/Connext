<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <title>Hồ sơ - Connext</title>
</head>

<body>
    <div class="app-shell">
        <div data-include="layouts/sidebar.html"></div>

        <div class="app-body">
            <div class="titlebar">CWF - Nguyễn Văn A</div>

            <main class="profile-page">
                <h1 class="profile-title">Hồ sơ cá nhân</h1>

                <section class="profile-info">
                    <div>
                        <div class="profile-avatar">
                            <img id="avatarPreview" class="hidden" alt="Ảnh đại diện">
                            <button type="button" class="avatar-upload" title="Đổi ảnh đại diện"
                                onclick="document.getElementById('avatarInput').click()"><img src="assets/upload.svg"
                                    height="24" alt=""></button>
                        </div>
                        <input type="file" id="avatarInput" class="hidden" accept="image/*">
                    </div>

                    <div class="profile-fields">
                        <div>
                            <label for="fullName" class="form-label">Họ và tên</label>
                            <input type="text" id="fullName" class="form-control" value="Nguyễn Văn A">
                        </div>
                        <div>
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" value="vana@gmail.com">
                        </div>
                        <div>
                            <label for="phone" class="form-label">Số điện thoại</label>
                            <input type="tel" id="phone" class="form-control" value="0987654321">
                        </div>
                        <div>
                            <label for="gender" class="form-label">Giới tính</label>
                            <select id="gender" class="form-select">
                                <option>Nam</option>
                                <option>Nữ</option>
                                <option>Khác</option>
                            </select>
                        </div>
                        <div class="profile-submit">
                            <button type="button" class="btn btn-primary" onclick="handleUpdateProfile()">Cập
                                nhật</button>
                        </div>
                    </div>
                </section>

                <h2 class="profile-title">Đổi mật khẩu</h2>

                <section class="password-fields">
                    <div>
                        <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                        <div class="input-group">
                            <input type="password" id="currentPassword" class="form-control">
                            <button type="button" class="btn toggle-pass"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div>
                        <label for="newPassword" class="form-label">Mật khẩu mới</label>
                        <div class="input-group">
                            <input type="password" id="newPassword" class="form-control">
                            <button type="button" class="btn toggle-pass"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div>
                        <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword" class="form-control">
                            <button type="button" class="btn toggle-pass"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div class="password-submit">
                        <button type="button" class="btn btn-primary" onclick="handleChangePassword()">Đổi mật
                            khẩu</button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script>
        document.getElementById('avatarInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;

            const preview = document.getElementById('avatarPreview');
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden');
        });

        function handleUpdateProfile() { /* BE: cập nhật hồ sơ */}
        function handleChangePassword() { /* BE: đổi mật khẩu */}
    </script>
</body>

</html>
