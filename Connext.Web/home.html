<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <title>Trang chủ - Connext</title>
</head>
<body>
    <div class="app-shell">
        <div data-include="layouts/sidebar.html"></div>
        <div class="app-body">
            <div class="titlebar">CWF - Nguyễn Văn A</div>
            <div class="app-content">
                <section class="list-panel">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <label class="search">
                            <img src="assets/search.svg" width="18" alt="">
                            <input type="text" placeholder="Tìm cuộc trò chuyện...">
                        </label>
                        <button type="button" class="icon-btn" title="Thêm bạn" onclick="openModal('addFriendModal')"><img src="assets/add-friend.svg" width="24" alt="Thêm bạn"></button>
                        <button type="button" class="icon-btn" title="Tạo nhóm" onclick="openModal('addGroupModal')"><img src="assets/add-group.svg" width="24" alt="Tạo nhóm"></button>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="button" class="tab-pill active">Tất cả </button>
                        <button type="button" class="tab-pill">Chưa đọc </button>
                        <button type="button" class="tab-pill ">Đã đọc </button>
                    </div>
                    <p class="empty-text">Hãy kết bạn để trò chuyện<br>với bạn bè</p>
                </section>
                <section class="chat-panel">
                    <div class="chat-head">
                        <div class="mini-logo"><i class="fa-regular fa-comment-dots"></i></div>
                    </div>
                    <p class="empty-text">Chào mừng trở lại</p>
                </section>
            </div>
        </div>
    </div>
    <div data-include="layouts/add-friend.html"></div>
    <div data-include="layouts/add-group.html"></div>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
