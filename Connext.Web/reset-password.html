<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <title>Quên mật khẩu - Connext</title>
</head>
<body>
    <div class="auth-page">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
        <div class="auth-card sm">
            
            <div id="step1">
                <a href="login.html" class="small text-muted-cnx text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập</a>
                <h4 class= "fw-bold mt-3 mb-3">Đặt lại mật khẩu</h4>
                <p class= "text-muted-cnx small mb-4"> Nhập địa chỉ email của bạn và chúng tôi sẽ gửi mã khôi phục để bạn đặt lại mật khẩu.</p>

                <div class="mb-4"> 
                    <label for="email" class="form-label">Địa chỉ email</label>
                    <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="Nhập email của bạn">
                </div>
            </div>
                <div id="msg1" class="small mb-3"></div>
                <button type="button" class="btn btn-primary w-100 py-2" onclick="handleSendcode(this, false)">Gửi mã khôi phục</button>
        </div>
        
            <div id="step2" class="hidden">
                <a href ="login.html" class="small text-muted-cnx text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập</a>
                <h4 class= "fw-bold mt-3 mb-3">Nhập mã</h4>
                <p class= "text-muted-cnx small mb-1"> Hãy nhập mã chúng tôi đã gửi vào email của bạn</p>
   
                    <div class="otp">
                        <input type="text" maxlength="1" >
                        <input type="text" maxlength="1" >
                        <input type="text" maxlength="1" > 
                        <input type="text" maxlength="1" >
                        <input type="text" maxlength="1" >
                        <input type="text" maxlength="1" >
                    </div>

                <div id="msg2" class="small mb-3"></div>
                <button type="button" class="btn btn-primary w-100 py-2 mb-2" onclick="handleVerify(this)">Xác thực</button>
                <button type="button" class="btn btn-light border w-100 py-2 mb-3" onclick="handleSendcode(this, true)">Gửi lại mã</button>
                <p class="text-center small mb-0">
                <button type="button" class="btn btn-link p-0 small text-decoration-none" onclick="showStep(1)">Thử với email khác</button>
                </p>            
            </div>


            <div id="step3" class="hidden">
                <a href ="login.html" class="small text-muted-cnx text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập</a>
                <h4 class="text-center fw-bold mt-3 mb-3">Đặt lại mật khẩu</h4>
                   <div class="mb-4"> 
                        <label for="newPassword" class="form-label">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="newPassword" class="form-control" placeholder="Nhập mật khẩu mới">
                            <button type="button" class="btn toggle-pass"><i class="bi bi-eye"></i></button>
                        </div>
                   </div>
                   <div class="mb-4"> 
                        <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu">
                            <button type="button" class="btn toggle-pass"><i class="bi bi-eye"></i></button>
                        </div>
                   </div>
                <div id="msg3" class="small mb-3"></div>
                <button type="button" class="btn btn-primary w-100 py-2"
                        onclick="handleResetPassword(this)">Đổi mật khẩu</button>
            </div>


    </div>
</div>        
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
    // Token ngắn hạn BE cấp sau khi nhập đúng OTP. Chỉ giữ trong bộ nhớ, không lưu vào localStorage.
    let resetToken = null;

    function showMsg(id, text, ok) {
        const el = document.getElementById(id);
        el.textContent = text || '';
        el.className = 'small mb-3 ' + (ok ? 'text-success' : 'text-danger');
    }

    function showStep(n) {
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.add('hidden');
        document.getElementById('step' + n).classList.remove('hidden');
        ['msg1', 'msg2', 'msg3'].forEach(id => showMsg(id, ''));
    }

    // Bước 1 (và nút "Gửi lại mã" ở bước 2): gửi OTP về email
    async function handleSendcode(btn, isResend) {
        const msgId = isResend ? 'msg2' : 'msg1';
        const email = document.getElementById('email').value.trim();
        if (!email) {
            showMsg(msgId, 'Vui lòng nhập email.');
            return;
        }

        btn.disabled = true;
        const r = await apiPost('/api/auth/forgot-password', { email });
        btn.disabled = false;

        if (!r.ok) {
            showMsg(msgId, r.message);
            return;
        }
        otpInputs.forEach(i => i.value = '');
        showStep(2);
        showMsg('msg2', r.message, true);
        otpInputs[0].focus();
    }

    // Bước 2: kiểm tra OTP, nhận resetToken
    async function handleVerify(btn) {
        const email = document.getElementById('email').value.trim();
        const otp = Array.from(otpInputs).map(i => i.value).join('');
        if (otp.length !== 6) {
            showMsg('msg2', 'Vui lòng nhập đủ 6 số.');
            return;
        }

        btn.disabled = true;
        const r = await apiPost('/api/auth/verify-otp', { email, otp });
        btn.disabled = false;

        if (!r.ok || !r.data || !r.data.resetToken) {
            showMsg('msg2', r.message);
            return;
        }
        resetToken = r.data.resetToken;
        showStep(3);
    }

    // Bước 3: đặt mật khẩu mới bằng resetToken
    async function handleResetPassword(btn) {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!resetToken) {
            showStep(1);
            showMsg('msg1', 'Phiên đặt lại mật khẩu đã hết hạn. Vui lòng gửi lại mã.');
            return;
        }
        if (newPassword.length < 6) {
            showMsg('msg3', 'Mật khẩu phải có ít nhất 6 ký tự.');
            return;
        }
        if (newPassword !== confirmPassword) {
            showMsg('msg3', 'Mật khẩu nhập lại không khớp.');
            return;
        }

        btn.disabled = true;
        const r = await apiPost('/api/auth/reset-password', { resetToken, newPassword, confirmPassword });

        if (!r.ok) {
            btn.disabled = false;
            showMsg('msg3', r.message);
            return;
        }
        resetToken = null;
        showMsg('msg3', r.message, true);
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    }

 const otpInputs = document.querySelectorAll('.otp input');
    otpInputs.forEach((input, i) => {
            input.addEventListener('focus', () => {
            input.select();
        });
        input.addEventListener('input', () => {
            input.value = input.value.replace(/[^0-9]/g, '');
            if (input.value && i < otpInputs.length - 1) {
                otpInputs[i + 1].focus();
            }
        });

        input.addEventListener('keydown', e => {
            if (e.key === 'Backspace' && !input.value && i > 0) {
                otpInputs[i - 1].value = '';
                otpInputs[i - 1].focus();
            }
        });
    });</script>
</body>
</html>
