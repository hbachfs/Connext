<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <title>Quên mật khẩu - Connext</title>
</head>
<body>
    <div class="auth-page">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
        <div class="auth-card sm">
            
            <div id="step1">
                <a href="login.html" class="small text-muted-cnx text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập</a>
                <h4 class= "fw-bold mt-3 mb-3">Đặt lại mật khẩu</h4>
                <p class= "text-muted-cnx small mb-4"> Nhập địa chỉ email của bạn và chúng tôi sẽ gửi mã khôi phục để bạn đặt lại mật khẩu.</p>

                <div class="mb-4"> 
                    <label for="email" class="form-label">Địa chỉ email</label>
                    <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="Nhập email của bạn">
                </div>
            </div>
                <button type="button" class="btn btn-primary w-100 py-2" onclick="handleSendcode()">Gửi mã khôi phục</button> 
        </div>
        
            <div id="step2" class="hidden">
                <a href ="login.html" class="small text-muted-cnx text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập</a>
                <h4 class= "fw-bold mt-3 mb-3">Nhập mã</h4>
                <p class= "text-muted-cnx small mb-1"> Hãy nhập mã chúng tôi đã gửi vào email của bạn</p>
   
                    <div class="otp">
                        <input type="text" maxlength="1" >
                        <input type="text" maxlength="1" >
                        <input type="text" maxlength="1" > 
                        <input type="text" maxlength="1" >
                        <input type="text" maxlength="1" >
                        <input type="text" maxlength="1" >
                    </div>

                <button type="button" class="btn btn-primary w-100 py-2 mb-2" onclick="handleVerify()">Xác thực</button>
                <button type="button" class="btn btn-light border w-100 py-2 mb-3" onclick="handleSendcode()">Gửi lại mã</button>
                <p class="text-center small mb-0">
                <button type="button" class="btn btn-link p-0 small text-decoration-none" onclick="showStep(1)">Thử với email khác</button>
                </p>            
            </div>


            <div id="step3" class="hidden">
                <a href ="login.html" class="small text-muted-cnx text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập</a>
                <h4 class="text-center fw-bold mt-3 mb-3">Đặt lại mật khẩu</h4>
                   <div class="mb-4"> 
                        <label for="newPassword" class="form-label">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="newPassword" class="form-control" placeholder="Nhập mật khẩu mới">
                            <button type="button" class="btn toggle-pass"><i class="bi bi-eye"></i></button>
                        </div>
                   </div>
                   <div class="mb-4"> 
                        <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu">
                            <button type="button" class="btn toggle-pass"><i class="bi bi-eye"></i></button>
                        </div>
                   </div>
                <button type="button" class="btn btn-primary w-100 py-2"
                        onclick="handleResetPassword()">Đổi mật khẩu</button>
            </div>


    </div>
</div>        
<script src="js/common.js"></script>
<script>
    function showStep(n) {
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.add('hidden');
        document.getElementById('step' + n).classList.remove('hidden');
    }

    function handleSendcode() {
        /* gọi API gửi mã về email */
        showStep(2);
    }

    function handleVerify() {
        /*gọi API kiểm tra mã OTP */
        showStep(3);
    }

    function handleResetPassword() {
        /* gọi API để đổi mật khẩu */
        window.location.href = 'login.html';
    }
 const otpInputs = document.querySelectorAll('.otp input');
    otpInputs.forEach((input, i) => {
            input.addEventListener('focus', () => {
            input.select();
        });
        input.addEventListener('input', () => {
            input.value = input.value.replace(/[^0-9]/g, '');
            if (input.value && i < otpInputs.length - 1) {
                otpInputs[i + 1].focus();
            }
        });

        input.addEventListener('keydown', e => {
            if (e.key === 'Backspace' && !input.value && i > 0) {
                otpInputs[i - 1].value = '';
                otpInputs[i - 1].focus();
            }
        });
    });</script>
</body>
</html>
