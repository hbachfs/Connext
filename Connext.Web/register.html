<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - Connext</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
        <div class="auth-card compact">

            <div class="auth-logo"><i class="fa-regular fa-comment-dots"></i></div>
            <h4 class="text-center mb-4">Chào mừng các bạn!</h4>

            <div class="mb-2">
                <label for="fullName" class="form-label">Họ và tên</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="fullName" class="form-control" placeholder="Nhập họ và tên của bạn">
                </div>
            </div>
            <div class="mb-2">
                <label for="phone" class="form-label">Số điện thoại</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                    <input type="tel" id="phone" class="form-control" placeholder="Nhập số điện thoại">
                </div>
            </div>
            <div class="mb-2">
                <label for="email" class="form-label">Địa chỉ email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="Nhập email của bạn">
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
                    <button type="button" class="btn toggle-pass">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu">
                    <button type="button" class="btn toggle-pass">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="button" class="btn btn-primary w-100 py-3" onclick="handleRegister()">Đăng ký</button>
            <p class="text-center text-muted-cnx mt-4 mb-0">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </p>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>function handleRegister() { /* nối API của BE */ }</script>
</body>
</html>
