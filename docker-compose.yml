# Hạ tầng dev của Connext: SQL Server, Redis, MinIO.
# Chạy: cp .env.example .env && docker compose up -d
# Ứng dụng (Api/Web) sẽ được thêm vào đây khi có Dockerfile.

name: connext

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: connext-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Hãy đặt MSSQL_SA_PASSWORD trong file .env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - connext-net

  redis:
    image: redis:7-alpine
    container_name: connext-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Hãy đặt REDIS_PASSWORD trong file .env}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - connext-net

  minio:
    image: minio/minio:latest
    container_name: connext-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Hãy đặt MINIO_ROOT_USER trong file .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Hãy đặt MINIO_ROOT_PASSWORD trong file .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - connext-net

volumes:
  sqlserver-data:
  redis-data:
  minio-data:

networks:
  connext-net:
    driver: bridge
