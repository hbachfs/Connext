name: Production Deploy to Azure VPS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Connection & Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VPS_HOST }}
          username: ${{ secrets.AZURE_VPS_USERNAME }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            if [ ! -d "$HOME/Connext/.git" ]; then
              git clone https://github.com/hbachfs/Connext.git "$HOME/Connext"
            fi
            cd "$HOME/Connext"

            git fetch --all --tags --force
            git checkout --force ${{ github.ref_name }}

            cat > .env <<'EOF'
            ${{ secrets.PROD_ENV_FILE }}
            EOF
            chmod 600 .env

            docker compose -f docker-compose.yml -f docker-compose.prod.yml down
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            echo "=== CONTAINER STATUS ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            docker image prune -f