name: Production Deploy to Azure VPS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Connection & Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VPS_HOST }}
          username: ${{ secrets.AZURE_VPS_USERNAME }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            if [ ! -d "$HOME/Connext/.git" ]; then
              git clone https://github.com/hbachfs/Connext.git "$HOME/Connext"
            fi
            cd "$HOME/Connext"

            git fetch --all --tags --force
            git checkout --force ${{ github.ref_name }}

            cat > .env <<'EOF'
            ${{ secrets.PROD_ENV_FILE }}
            EOF
            chmod 600 .env

            docker compose -f docker-compose.yml -f docker-compose.prod.yml down
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            echo "=== CONTAINER STATUS ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            docker image prune -f

      - name: Smoke Test API Health Check
        run: |
          echo "Checking API health endpoint..."
          TARGET_URL="https://connext-app.eastasia.cloudapp.azure.com/api/health"
          for i in {1..12}; do
            STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" "$TARGET_URL" || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "204" ]; then
              echo "Smoke test passed! ($TARGET_URL -> HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/12: API not ready yet (HTTP $STATUS), retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Smoke test failed for $TARGET_URL after 60s!"
          exit 1