services:
  nginx:
    image: nginx:alpine
    container_name: connext_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - connext-web
      - api

  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

